# Flatpak manifest for Input Remapper (SteamOS / Steam Deck target, KDE Desktop mode).
#
# Goal: a single downloadable bundle that installs in one click and bundles every
# graphical library the window needs, so it works on the immutable SteamOS
# filesystem and survives OS updates (Flatpak data lives under /home).
#
# This bundle is built by GitHub Actions (.github/workflows/flatpak.yml), not on
# the end-user's machine. Dependencies are fetched from PyPI/git at build time
# (no machine-specific pinning). This is intentionally NOT Flathub-compliant yet
# (network access during build); pin with flatpak-pip-generator before any
# Flathub submission.
#
# The only thing Flatpak cannot provide is kernel-level device access (uinput).
# On SteamOS that is already granted (Valve's uaccess ACL on /dev/uinput).

app-id: io.github.sezanzeb.input_remapper
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: input-remapper-gtk

finish-args:
  # Force the session-bus / no-pkexec code path inside the sandbox.
  - --env=INPUT_REMAPPER_SESSION_BUS=1
  # /app/lib/pythonX.Y/site-packages is not on the runtime python path by
  # default. Point PYTHONPATH at it (cover the likely runtime python versions)
  # so the bundled inputremapper module and its deps are importable.
  - --env=PYTHONPATH=/app/lib/python3.13/site-packages:/app/lib/python3.12/site-packages:/app/lib/python3.11/site-packages
  # Display
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # The in-app updater talks to GitHub
  - --share=network
  # All input devices + uinput for reading and injecting events
  - --device=all
  # Tray icon (StatusNotifierItem) on the KDE panel
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  # The service owns inputremapper.Control on the session bus. IMPORTANT: do NOT
  # also add --talk-name for this name -- a later talk policy overrides own and
  # the service then gets AccessDenied on RequestName. own already implies talk.
  - --own-name=inputremapper.Control
  # Run the one-time host device-access helper (udev rule) via flatpak-spawn
  - --talk-name=org.freedesktop.Flatpak
  # Read Steam's installed-game manifests and non-Steam shortcuts so per-game
  # presets can be matched (internal drive, microSD libraries, Flatpak Steam)
  - --filesystem=~/.steam:ro
  - --filesystem=~/.local/share/Steam:ro
  - --filesystem=~/.var/app/com.valvesoftware.Steam:ro
  - --filesystem=/run/media:ro
  # Persist presets and config under the host home (kept on uninstall by default)
  - --filesystem=~/.config/input-remapper-2:create
  # Write the login autostart entry (Settings -> autostart / auto-hidden)
  - --filesystem=~/.config/autostart:create

modules:
  # --- GtkSourceView 4 (the GNOME 47 runtime ships v5; the editor uses v4) ---
  - name: gtksourceview4
    buildsystem: meson
    config-opts:
      # meson installs into lib64 on x86_64, where the GI repository is not
      # searched: GtkSource-4.typelib would be invisible and the app would not
      # start at all ("Namespace GtkSource not available for version 4")
      - --libdir=lib
      - -Dvapi=false
      - -Dgtk_doc=false
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/gtksourceview.git
        tag: '4.8.4'
    cleanup:
      - /include
      - /lib/pkgconfig
      - '*.la'

  # --- Tray icon stack (StatusNotifierItem) for KDE Plasma Wayland ---
  # Gtk.StatusIcon is invisible on Wayland; KDE needs SNI via AppIndicator.
  # Chain: intltool -> libdbusmenu -> ayatana-ido -> libayatana-indicator ->
  #        libayatana-appindicator.
  # intltool is a build-only tool needed by libdbusmenu; not in the GNOME SDK.
  - name: intltool
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://launchpad.net/intltool/trunk/0.51.0/+download/intltool-0.51.0.tar.gz
        sha256: 67c74d94196b153b774ab9f89b2fa6c6ba79352407037c8c14d5aeb334e959cd

  - name: libdbusmenu
    buildsystem: autotools
    build-options:
      cflags: -Wno-error
      env:
        HAVE_VALGRIND_FALSE: '#'
        HAVE_VALGRIND_TRUE: ''
    config-opts:
      - --with-gtk=3
      - --disable-dumper
      - --disable-static
      - --disable-tests
      - --disable-gtk-doc
      - --enable-introspection=yes
      - --disable-vala
    cleanup:
      - /include
      - /libexec
      - /lib/pkgconfig
      - '*.la'
    sources:
      - type: archive
        url: https://launchpad.net/libdbusmenu/16.04/16.04.0/+download/libdbusmenu-16.04.0.tar.gz
        sha256: b9cc4a2acd74509435892823607d966d424bd9ad5d0b00938f27240a1bfa878a

  - name: libayatana-ido
    buildsystem: cmake-ninja
    # cmake defaults to lib64 on x86_64, where neither pkg-config nor the
    # runtime linker looks: the next module then fails to find this one
    config-opts:
      - -DCMAKE_INSTALL_LIBDIR=lib
    cleanup:
      - /include
      - /lib/pkgconfig
    sources:
      - type: git
        url: https://github.com/AyatanaIndicators/ayatana-ido.git
        tag: '0.10.1'

  - name: libayatana-indicator
    buildsystem: cmake-ninja
    # cmake defaults to lib64 on x86_64, where neither pkg-config nor the
    # runtime linker looks: the next module then fails to find this one
    config-opts:
      - -DCMAKE_INSTALL_LIBDIR=lib
    cleanup:
      - /include
      - /lib/pkgconfig
    sources:
      - type: git
        url: https://github.com/AyatanaIndicators/libayatana-indicator.git
        tag: '0.9.4'

  - name: libayatana-appindicator
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DENABLE_BINDINGS_MONO=NO
      - -DENABLE_BINDINGS_VALA=NO
      - -DENABLE_GTKDOC=NO
    cleanup:
      - /include
      - /lib/pkgconfig
    sources:
      - type: git
        url: https://github.com/AyatanaIndicators/libayatana-appindicator.git
        tag: '0.5.93'

  # --- Python dependencies not bundled in the GNOME runtime ---
  # PyGObject and pycairo are already provided by org.gnome.Platform.
  # Installed straight from PyPI at build time (network enabled below).
  - name: python-deps
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - pip3 install --prefix=${FLATPAK_DEST} evdev dasbus pydantic psutil packaging

  # --- Input Remapper itself (built from this repository) ---
  - name: input-remapper
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      # Stage the python module + data files using the project's installer.
      - python3 -m install --root=${FLATPAK_DEST}
      # The installer lays data/bins under /usr and (because it resolves the
      # package dir from /app/lib) the python module under /app/app. Flatpak
      # expects everything directly under /app, so fold both back up.
      - 'cp -a ${FLATPAK_DEST}/usr/. ${FLATPAK_DEST}/ 2>/dev/null || true'
      - 'rm -rf ${FLATPAK_DEST}/usr'
      - 'cp -a ${FLATPAK_DEST}/app/. ${FLATPAK_DEST}/ 2>/dev/null || true'
      - 'rm -rf ${FLATPAK_DEST}/app'
      - 'sed -i "s|/usr/share/input-remapper|/app/share/input-remapper|g" ${FLATPAK_DEST}/lib/python*/site-packages/inputremapper/installation_info.py || true'
      # Flatpak only exports a desktop entry + icon named exactly after the
      # app-id. Rename them explicitly (no || true: fail loudly if missing).
      - 'mv ${FLATPAK_DEST}/share/applications/input-remapper-gtk.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop'
      - 'sed -i "s/^Icon=.*/Icon=${FLATPAK_ID}/" ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop'
      - 'mv ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/input-remapper.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg'
      # appstreamcli compose needs a raster icon it can read (the SVG is sized
      # in millimetres and fails to rasterise). Ship the 128x128 PNG too.
      - 'install -Dm644 data/input-remapper-large.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png'
      # Standard tray sizes so the Plasma system tray does not have to scale
      # the scalable SVG itself (avoids padding/spacing artifacts). Rendered
      # at build time with the runtime's librsvg.
      - |
        python3 - <<'PYEOF'
        import os
        import gi
        gi.require_version("Rsvg", "2.0")
        from gi.repository import Rsvg
        import cairo

        svg = Rsvg.Handle.new_from_file("data/input-remapper.svg")
        dest_root = os.environ["FLATPAK_DEST"]
        app_id = os.environ["FLATPAK_ID"]
        for size in (22, 24, 32, 48):
            surface = cairo.ImageSurface(cairo.FORMAT_ARGB32, size, size)
            context = cairo.Context(surface)
            rect = Rsvg.Rectangle()
            rect.x = rect.y = 0
            rect.width = rect.height = size
            svg.render_document(context, rect)
            dest = os.path.join(
                dest_root, f"share/icons/hicolor/{size}x{size}/apps/{app_id}.png"
            )
            os.makedirs(os.path.dirname(dest), exist_ok=True)
            surface.write_to_png(dest)
            print("icon", dest)
        PYEOF
      # The metainfo's <launchable> still points at the old desktop filename;
      # update it to the renamed one so appstreamcli can resolve the desktop
      # file (and thus the icon), otherwise the build fails gui-app-without-icon.
      - 'sed -i "s|input-remapper-gtk.desktop|${FLATPAK_ID}.desktop|" ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml'
      # Ship the host device-access helper (run via flatpak-spawn --host pkexec).
      - install -Dm755 install/flatpak/host/input-remapper-device-access ${FLATPAK_DEST}/bin/input-remapper-device-access
      # Ship the host game-scan helper (run unprivileged via flatpak-spawn --host)
      # for the game auto-switcher: the sandbox cannot see host processes.
      - install -Dm755 install/flatpak/host/input-remapper-game-scan ${FLATPAK_DEST}/bin/input-remapper-game-scan
    sources:
      # Build THIS working tree, not a remote branch. Pointing at GitHub's
      # `dev` meant the bundle silently ignored every local change and every
      # commit that only exists on the NAS forge.
      - type: dir
        path: ../..
        skip:
          - .flatpak-builder
          - .git
          - _livraison
