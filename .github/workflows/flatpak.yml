name: Flatpak bundle

# Builds a downloadable one-click .flatpak on GitHub's runners, independent of
# any contributor's machine, and publishes it as the rolling `dev-latest`
# prerelease so anyone can download it without a GitHub account. `dev-latest` is
# also the tag the in-app updater's "dev" channel looks for.

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'install/flatpak/**'
      - '.github/workflows/flatpak.yml'
      - 'inputremapper/**'
      - 'bin/**'
      - 'data/**'
      - 'install/**'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  flatpak:
    name: Build bundle
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      # The in-app updater compares version strings, and parses the available
      # one from the asset name (input-remapper-<version>.flatpak, see
      # inputremapper/update_service.py). A rolling channel that republishes the
      # same number can therefore never offer anything: the updater concludes
      # "already on it" and keeps the install button disabled. So every dev
      # build gets its own number, <pyproject>.dev<run>, stamped into the three
      # places that decide what the app reports and what the store displays.
      # `dev` carries the NEXT version (1.0.1 while 1.0.0 is the stable), which
      # is what makes 1.0.1.dev42 sort above the released 1.0.0.
      # Tag builds (v*) publish the pyproject version untouched.
      - name: Resolve app version
        run: |
          BASE_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n1)"
          APP_VERSION="${BASE_VERSION}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            APP_VERSION="${BASE_VERSION}.dev${GITHUB_RUN_NUMBER}"
            sed -i "s/^version = \".*\"/version = \"${APP_VERSION}\"/" pyproject.toml
            sed -i "s/^VERSION = \".*\"/VERSION = \"${APP_VERSION}\"/" inputremapper/installation_info.py
            sed -i "s/^COMMIT_HASH = \".*\"/COMMIT_HASH = \"${GITHUB_SHA}\"/" inputremapper/installation_info.py
            sed -i "s|<release version=\"${BASE_VERSION}\"|<release version=\"${APP_VERSION}\"|" data/io.github.sezanzeb.input_remapper.metainfo.xml
          fi
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"

      # A stamp that missed one file would ship a bundle whose reported version
      # is not the one the updater compares against, which is the defect this
      # whole step exists to prevent. Fail here instead.
      - name: Check every version location carries the build version
        run: |
          test "$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n1)" = "${APP_VERSION}"
          test "$(sed -n 's/^VERSION = "\(.*\)"/\1/p' inputremapper/installation_info.py)" = "${APP_VERSION}"
          grep -q "<release version=\"${APP_VERSION}\"" data/io.github.sezanzeb.input_remapper.metainfo.xml

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: input-remapper-${{ env.APP_VERSION }}.flatpak
          manifest-path: install/flatpak/io.github.sezanzeb.input_remapper.yml
          cache-key: flatpak-builder-${{ github.sha }}

      # Each build now has its own asset name, so a new bundle no longer
      # replaces the previous one by name: without this the rolling release
      # would accumulate every build ever made, and the updater would have to
      # choose among them.
      # This container has python3 but no `gh` and no `jq`, and the script
      # fails loudly rather than reporting success without removing anything —
      # a silent cleanup is how dev-latest came to carry three bundles at once.
      - name: Drop the assets left by the previous dev build
        if: github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/clear-release-assets.py "$GITHUB_REPOSITORY" dev-latest

      - name: Publish rolling dev-latest release
        if: github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          # The release title doubles as the displayed version in the in-app
          # updater, keep it parseable (same convention as channel-release.yml).
          name: ${{ env.APP_VERSION }}
          prerelease: true
          files: input-remapper-${{ env.APP_VERSION }}.flatpak
          body: |
            Rolling development build of the SteamOS / Steam Deck Flatpak bundle.
            Built from commit ${{ github.sha }}.

            Download `input-remapper-${{ env.APP_VERSION }}.flatpak` below and
            double-click it (Discover) to install, in Desktop mode. See
            [readme/steamos.md](https://github.com/gypg7p6c24-byte/input-remapper/blob/dev/readme/steamos.md).

      - name: Attach bundle to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: input-remapper-${{ env.APP_VERSION }}.flatpak
